---
# defaults file for roles/mermaid_cli
#
# Mermaid 記法の図を SVG/PNG/PDF に変換する CLI (mmdc) を npm global で入れる。
# node/npm は roles/nodejs が入れる前提。単体で使う場合も先に node を用意すること。

# 導入する @mermaid-js/mermaid-cli のバージョン。
# 空文字にすると最新版を入れる (npm の既定動作に委ねる)。
# 11.9.0 は Quarto 1.8 系 + rsvg-convert 2.52 との組み合わせで動作を確認した版。
mermaid_cli_version: "11.9.0"

# mmdc は内部で Puppeteer (ヘッドレス Chromium) を使って描画する。
# npm install は成功しても、Chromium の共有ライブラリが無いと
# 「実行時に」失敗する。既定で先に入れておく。
mermaid_cli_install_chromium_deps: true

# Puppeteer 同梱 Chromium の実行時依存。
# Ubuntu 22.04 で全パッケージの解決を確認済み。
# 24.04 以降は t64 移行でパッケージ名が変わったものがあり、解決に失敗する場合は
# この変数を上書きすること (README 参照)。
mermaid_cli_chromium_packages:
  - ca-certificates
  - fonts-liberation
  - "{{ 'libasound2t64'
        if (ansible_facts['distribution'] == 'Ubuntu'
            and ansible_facts['distribution_major_version'] | int >= 24)
        else 'libasound2' }}"
  - libatk-bridge2.0-0
  - libatk1.0-0
  - libcairo2
  - libcups2
  - libdbus-1-3
  - libdrm2
  - libexpat1
  - libgbm1
  - libglib2.0-0
  - libgtk-3-0
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
